spring:
  application:
    name: casacapital-backend

  datasource:
    url: jdbc:mysql://localhost:3306/casacapital?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:casacapital_app}
    password: ${DB_PASSWORD:changeme}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

casacapital:
  jwt:
    # Troque via variável de ambiente JWT_SECRET em qualquer ambiente real.
    secret: ${JWT_SECRET:troque-este-segredo-antes-de-usar-em-producao-0123456789abcdef}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:720}

logging:
  level:
    com.casacapital.backend: DEBUG
  file:
    name: logs/casacapital.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 14
