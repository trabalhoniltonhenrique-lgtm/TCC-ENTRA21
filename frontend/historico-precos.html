<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="css/style.css">
  <title>CasaCapital — Histórico de Preços</title>
</head>
<body>
<script src="js/api.js"></script>
<script src="js/cores.js"></script>
<script src="js/header.js"></script>
<div class="container historico-precos-container">

  <!-- Cabeçalho -->
  <div class="historico-cabecalho">
    <div>
      <h2><span class="ico ico-tag"></span> Histórico de Preços</h2>
      <p>Acompanhe a evolução do preço de cada produto comprado.</p>
    </div>
    <div class="cabecalho-acoes">
      <input id="buscaHistoricoPreco" placeholder="Buscar produto...">
      <button class="btn-secundario btn-relatorio-modulo" data-relatorio-modulo><span class="ico ico-file-text"></span> Relatório</button>
    </div>
  </div>

  <!-- Resumo -->
  <div class="bloco-resumo-historico">
    <div class="resumo-grid" id="resumoHistoricoPrecos"></div>
  </div>

  <!-- Lista de produtos com histórico -->
  <div class="lista-historico-precos-wrap" id="listaHistoricoPrecos"></div>

</div>
<script src="js/app.js"></script>
<script src="js/historico-precos.js"></script>
<script src="js/relatorio-modulo.js"></script>
</body>
</html>
