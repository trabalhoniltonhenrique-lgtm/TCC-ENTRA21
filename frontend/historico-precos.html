<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <!-- Tela inicial do celular (ícone e nome do app) -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="img/favicon-32.png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <meta name="theme-color" content="#1E3A8A">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="CasaCapital">
  <link rel="stylesheet" href="css/style.css">
  <title>CasaCapital — Histórico de Preços</title>
</head>
<body>
<script src="js/util.js"></script>
<script src="js/api.js"></script>
<script src="js/cores.js"></script>
<script src="js/header.js"></script>
<div class="container historico-precos-container">

  <!-- Cabeçalho -->
  <div class="historico-cabecalho">
    <div>
      <h2><span class="ico ico-tag"></span> Histórico de Preços</h2>
      <p>Acompanhe a evolução do preço de cada produto comprado.</p>
    </div>
    <div class="cabecalho-acoes">
      <input id="buscaHistoricoPreco" placeholder="Buscar produto...">
      <a href="nota-fiscal.html"><button class="btn-secundario"><span class="ico ico-note"></span> Ler nota do mercado</button></a>
      <a href="mercados.html"><button class="btn-secundario"><span class="ico ico-chart-bar"></span> Comparar mercados</button></a>
      <button class="btn-secundario btn-relatorio-modulo" data-relatorio-modulo><span class="ico ico-file-text"></span> Relatório</button>
    </div>
  </div>

  <!-- Resumo -->
  <div class="bloco-resumo-historico">
    <div class="resumo-grid" id="resumoHistoricoPrecos"></div>
  </div>

  <!-- Lista de produtos com histórico -->
  <div class="lista-historico-precos-wrap" id="listaHistoricoPrecos"></div>

</div>
<script src="js/app.js"></script>
<script src="js/app-financas.js"></script>
<script src="js/app-compras.js"></script>
<script src="js/app-tarefas.js"></script>
<script src="js/app-painel.js"></script>
<script src="js/app-planejamento.js"></script>
<script src="js/historico-precos.js"></script>
<script src="js/relatorio-modulo.js"></script>
</body>
</html>
