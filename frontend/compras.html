<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/app.js"></script>
  <title>CasaCapital — Compras</title>
</head>
<body>
<script src="js/api.js"></script>
<script src="js/header.js"></script>
<div class="container">
  <div class="cards compras-wrap">
    <div class="card compras-card">
      <h2><span class="ico ico-cart"></span> Lista de Compras</h2>
      <p class="compras-intro">
        Adicione os itens que precisam ser comprados. Ao marcar <span class="destaque"><span class="ico ico-check"></span></span> como comprado, o item vai direto para a&nbsp;<a href="dispensa.html">Dispensa</a>
      </p>

      <!-- Formulário de adição -->
      <div class="compras-form-add">
        <input id="compra" placeholder="Nome do item...">
        <button id="btnAddCompra">Adicionar</button>
      </div>
      <div class="compras-form-extra">
        <div class="campo-cat">
          <label>Categoria</label>
          <select id="compraCat"></select>
        </div>
        <div class="campo-qtd">
          <label>Quantidade</label>
          <input id="compraQtd" type="number" value="1" min="1">
        </div>
        <div class="campo-frequencia">
          <label>Frequência</label>
          <select id="compraFrequencia"></select>
        </div>
      </div>

      <!-- Feedback de transferência -->
      <div id="msgCompra" class="msg-compra"></div>

      <!-- Filtro por frequência -->
      <div id="filtrosFrequenciaCompra" class="filtro-tabs filtro-tabs-frequencia"></div>

      <!-- Lista agrupada -->
      <ul id="listaCompras" class="lista"></ul>

      <!-- Link rápido para dispensa -->
      <div class="compras-rodape">
        <span class="info">Itens comprados vão para a dispensa automaticamente.</span>
        <a href="dispensa.html" class="link-dispensa">Ver Dispensa →</a>
      </div>
    </div>
  </div>
</div>
<script src="js/compras.js"></script>
</body>
</html>
