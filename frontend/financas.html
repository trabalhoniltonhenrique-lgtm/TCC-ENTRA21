<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <!-- Tela inicial do celular (ícone e nome do app) -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="img/favicon-32.png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <meta name="theme-color" content="#1E3A8A">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="CasaCapital">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/app.js"></script>
  <script src="js/app-financas.js"></script>
  <script src="js/app-compras.js"></script>
  <script src="js/app-tarefas.js"></script>
  <script src="js/app-painel.js"></script>
  <script src="js/app-planejamento.js"></script>
  <title>CasaCapital — Finanças</title>
</head>
<body>
<script src="js/api.js"></script>
<script src="js/cores.js"></script>
<script src="js/header.js"></script>
<div class="container">

  <!-- Filtro de mês -->
  <div class="bloco-filtro-periodo">
    <div class="card-box">
      <div class="filtro-periodo-linha">
        <span class="rotulo"><span class="ico ico-calendar"></span> Período:</span>
        <select id="filtroMes">
          <option value="">Todos os meses</option>
        </select>
        <span id="labelPeriodo" class="periodo-texto"></span>
        <button id="btnLimparFiltro" class="btn-secundario btn-sm">Limpar filtro</button>
        <button class="btn-secundario btn-relatorio-modulo" data-relatorio-modulo><span class="ico ico-file-text"></span> Relatório</button>
      </div>
      <div class="atalhos-financas">
        <a href="fechamento.html" class="atalho-financas"><span class="ico ico-calendar-days"></span> Fechamento do mês</a>
        <a href="imposto-renda.html" class="atalho-financas"><span class="ico ico-file-text"></span> Imposto de Renda</a>
        <a href="nota-fiscal.html" class="atalho-financas"><span class="ico ico-note"></span> Nota do mercado (QR code)</a>
      </div>
    </div>
  </div>

  <div class="cards">

    <!-- Receitas -->
    <div class="card card-full">
      <h2><span class="ico ico-trending-up"></span> Receitas</h2>
      <input id="receitaNome" placeholder="Descrição (ex: Salário)">
      <div class="linha-dupla">
        <select id="receitaCat"></select>
        <input id="receitaData" type="date">
      </div>
      <select id="receitaMembro"><option value="">Sem membro vinculado</option></select>
      <input id="receitaValor" type="number" placeholder="Valor (R$)" data-moeda-label="Valor ({moeda})" min="0" step="0.01">
      <button id="btnAddReceita" class="btn-verde">+ Adicionar Receita</button>
      <ul id="listaReceitas" class="lista lista-form"></ul>
    </div>

    <!-- Despesas -->
    <div class="card card-full">
      <h2><span class="ico ico-trending-down"></span> Despesas</h2>
      <input id="despesaNome" placeholder="Descrição (ex: Aluguel)">
      <div class="linha-dupla">
        <select id="despesaCat"></select>
        <input id="despesaData" type="date">
      </div>
      <select id="despesaMembro"><option value="">Sem membro vinculado</option></select>
      <input id="despesaValor" type="number" placeholder="Valor (R$)" data-moeda-label="Valor ({moeda})" min="0" step="0.01">
      <button id="btnAddDespesa" class="btn-perigo">+ Adicionar Despesa</button>
      <ul id="listaDespesas" class="lista lista-form"></ul>
    </div>

  </div>

  <!-- Saldo + Resumo por categoria + Resumo por membro -->
  <div class="bloco-resumo-financas">
    <div class="card-box card-saldo-financas">
      <div class="topo">
        <div>
          <div class="rotulo-saldo" id="labelSaldo">Saldo Familiar</div>
          <div id="saldo">R$ 0,00</div>
          <div class="resumo-rd">
            <span id="resumoReceitas">↑ Receitas: R$ 0,00</span>
            <span id="resumoDespesas">↓ Despesas: R$ 0,00</span>
          </div>
        </div>
      </div>
    </div>
    <div class="card-box" id="cardAssinaturas"></div>
    <div class="card-box" id="resumoCategoria"></div>
    <div class="card-box" id="resumoMembros"></div>
  </div>
</div>
<script src="js/financas.js"></script>
<script src="js/assinaturas.js"></script>
<script src="js/relatorio-modulo.js"></script>
</body>
</html>
