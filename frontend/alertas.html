<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <!-- Tela inicial do celular (ícone e nome do app) -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="img/favicon-32.png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <meta name="theme-color" content="#1E3A8A">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="CasaCapital">
  <link rel="stylesheet" href="css/style.css">
  <title>CasaCapital — Alertas</title>
</head>
<body>
<script src="js/api.js"></script>
<script src="js/cores.js"></script>
<script src="js/header.js"></script>
<div class="container">
  <div class="cards compras-wrap">
    <div class="card alertas-card">
      <div class="titulo-com-acao">
        <h2><span class="ico ico-bell"></span> Alertas de Limite por Categoria</h2>
        <button class="btn-secundario btn-relatorio-modulo" data-relatorio-modulo><span class="ico ico-file-text"></span> Relatório</button>
      </div>
      <p class="alertas-intro">
        Defina um valor máximo por categoria. Você será avisado quando o gasto ultrapassar o limite.
      </p>
      <div class="alertas-form">
        <select id="alertaCat"></select>
        <input id="alertaLimite" type="number" placeholder="Limite (R$)" data-moeda-label="Limite ({moeda})" min="0" step="0.01">
        <button id="btnSalvarAlerta">Salvar</button>
      </div>
      <div id="painelAlertas" class="painel-alertas-margem"></div>
      <ul id="listaAlertas" class="lista"></ul>
    </div>
  </div>
</div>
<script src="js/app.js"></script>
<script src="js/app-financas.js"></script>
<script src="js/app-compras.js"></script>
<script src="js/app-tarefas.js"></script>
<script src="js/app-painel.js"></script>
<script src="js/app-planejamento.js"></script>
<script src="js/alertas.js"></script>
<script src="js/relatorio-modulo.js"></script>
</body>
</html>
