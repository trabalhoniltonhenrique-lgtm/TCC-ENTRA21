<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <!-- Tela inicial do celular (ícone e nome do app) -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="img/favicon-32.png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <meta name="theme-color" content="#1E3A8A">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="CasaCapital">
  <link rel="stylesheet" href="css/style.css">
  <title>CasaCapital — Criar Conta</title>
</head>
<body>
<main class="center">
  <section class="card">
    <div class="login-cabecalho">
      <span class="login-logo">EC</span>
      <h1 class="login-titulo">Criar Conta</h1>
      <p class="login-subtitulo">Comece sua gestão financeira doméstica</p>
    </div>
    <input id="cadNome" placeholder="Nome Completo">
    <input id="cadNomeFamilia" placeholder="Nome da Família (ex: Família Silva)">
    <input type="email" id="cadEmail" placeholder="E-mail">
    <input type="password" id="cadSenha" placeholder="Senha (mínimo 6 caracteres)">
    <input type="password" id="cadConfirmarSenha" placeholder="Confirmar Senha">
    <p id="cadastroErro" class="login-erro oculto"></p>
    <div id="badgePlano" class="badge-plano-aviso">
      <span><span class="ico ico-clipboard"></span></span>
      <span id="textoBadge"><strong>Plano Essencial</strong> — R$ 19,90/mês</span>
    </div>
    <button id="btnFinalizarCadastro">Finalizar Cadastro</button>
    <a href="planos.html">← Alterar plano</a>
    <a href="index.html" class="link-espacado">Já tem conta? <strong>Entrar</strong></a>
  </section>
</main>
<script src="js/util.js"></script>
<script src="js/api.js"></script>
<script src="js/cores.js"></script>
<script src="js/cadastro.js"></script>
</body>
</html>
