<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="css/style.css">
  <title>CasaCapital — Login</title>
</head>
<body>
<main class="center">
  <section class="card">
    <div class="login-cabecalho">
      <span class="login-logo">EC</span>
      <h1 class="login-titulo">CasaCapital</h1>
      <p class="login-subtitulo">Bem-vindo de volta</p>
    </div>
    <input type="email" id="loginEmail" placeholder="E-mail">
    <input type="password" id="loginSenha" placeholder="Senha">
    <p id="loginErro" class="login-erro oculto"></p>
    <button id="btnEntrar">Entrar</button>
    <a href="cadastro.html">Não tem conta? <strong>Criar conta gratuita</strong></a>
  </section>
</main>
<script src="js/api.js"></script>
<script src="js/index.js"></script>
</body>
</html>
