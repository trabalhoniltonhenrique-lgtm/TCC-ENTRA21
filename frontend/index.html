<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <!-- Tela inicial do celular (ícone e nome do app) -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="img/favicon-32.png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <meta name="theme-color" content="#1E3A8A">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="CasaCapital">
  <link rel="stylesheet" href="css/style.css">
  <title>CasaCapital — Login</title>
</head>
<body>
<main class="center">
  <section class="card">
    <div class="login-cabecalho">
      <span class="login-logo">EC</span>
      <h1 class="login-titulo">CasaCapital</h1>
      <p class="login-subtitulo">Bem-vindo de volta</p>
    </div>
    <input type="text" id="loginEmail" placeholder="E-mail (ou usuário, no login dos filhos)" autocomplete="username" autocapitalize="none" spellcheck="false">
    <input type="password" id="loginSenha" placeholder="Senha">
    <p id="loginErro" class="login-erro oculto"></p>
    <button id="btnEntrar">Entrar</button>
    <a href="esqueci-senha.html" class="link-espacado">Esqueci minha senha</a>
    <a href="cadastro.html">Não tem conta? <strong>Criar conta gratuita</strong></a>
  </section>
</main>
<script src="js/api.js"></script>
<script src="js/cores.js"></script>
<script src="js/index.js"></script>
</body>
</html>
