<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <!-- Tela inicial do celular (ícone e nome do app) -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="img/favicon-32.png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <meta name="theme-color" content="#1E3A8A">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="CasaCapital">
  <link rel="stylesheet" href="css/style.css">
  <title>CasaCapital — Gestão Financeira Doméstica</title>
</head>
<body>
<main class="center">
  <section class="card home-card">
    <div class="home-logo-wrap">
      <span class="home-logo">EC</span>
    </div>
    <h1 class="home-titulo">CasaCapital</h1>
    <p class="home-subtitulo">Soluções inteligentes para <strong>gestão financeira</strong> doméstica.</p>
    <div class="home-actions">
      <button data-href="index.html">Entrar</button>
      <button data-href="planos.html" class="btn-secundario">Criar Conta</button>
    </div>
    <div class="home-features">
      <div><div class="icone"><span class="ico ico-home"></span></div><div class="rotulo">Organização</div></div>
      <div><div class="icone"><span class="ico ico-trending-up"></span></div><div class="rotulo">Crescimento</div></div>
      <div><div class="icone"><span class="ico ico-lock"></span></div><div class="rotulo">Segurança</div></div>
    </div>
  </section>
</main>
<script src="js/home.js"></script>
</body>
</html>
