<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <!-- Tela inicial do celular (ícone e nome do app) -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="img/favicon-32.png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <meta name="theme-color" content="#1E3A8A">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="CasaCapital">
  <link rel="stylesheet" href="css/style.css">
  <title>CasaCapital — Dispensa</title>
</head>
<body>
<script src="js/api.js"></script>
<script src="js/cores.js"></script>
<script src="js/header.js"></script>
<div class="container dispensa-container">

  <!-- Cabeçalho -->
  <div class="dispensa-cabecalho">
    <div>
      <h2><span class="ico ico-package"></span> Dispensa da Casa</h2>
      <p>Itens disponíveis em casa. Ajuste as quantidades conforme o uso.</p>
    </div>
    <div class="acoes">
      <input id="busca" placeholder="Buscar item...">
      <a href="compras.html"><button class="btn-secundario"><span class="ico ico-cart"></span> Lista de Compras</button></a>
      <button class="btn-secundario btn-relatorio-modulo" data-relatorio-modulo><span class="ico ico-file-text"></span> Relatório</button>
      <button id="btnExportarPdf"><span class="ico ico-file-text"></span> Exportar PDF <span class="premium-tag">PREMIUM</span></button>
    </div>
  </div>

  <!-- Resumo -->
  <div class="bloco-resumo-dispensa">
    <div class="resumo-grid" id="resumoDispensa"></div>
  </div>

  <!-- Adicionar item direto na dispensa -->
  <div class="bloco-add-dispensa">
    <div class="card-box">
      <div class="titulo">+ Adicionar diretamente à dispensa</div>
      <div class="linha">
        <input id="dispensaNome" class="campo-nome" placeholder="Nome do item">
        <select id="dispensaCat" class="campo-cat"></select>
        <input id="dispensaQtd" class="campo-qtd" type="number" value="1" min="1">
        <button id="btnAddDispensa">Adicionar</button>
      </div>
    </div>
  </div>

  <!-- Lista da dispensa por categoria -->
  <div class="lista-dispensa-wrap" id="listaDispensa"></div>

</div>
<script src="js/app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="js/dispensa.js"></script>
<script src="js/relatorio-modulo.js"></script>
</body>
</html>
