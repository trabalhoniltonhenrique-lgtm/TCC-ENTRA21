<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="css/style.css">
  <title>CasaCapital — Análises Premium</title>
</head>
<body>
<script src="js/api.js"></script>
<script src="js/header.js"></script>
<div class="container analises-container">

  <!-- Painel de alertas disparados -->
  <div class="bloco-analises" id="painelAlertas"></div>

  <!-- Gráfico de barras — Receitas x Despesas por mês -->
  <div class="bloco-analises com-margem">
    <div class="secao">
      <h2>📊 Receitas vs Despesas — Últimos 6 meses</h2>
      <canvas id="graficoBarras" class="canvas-full"></canvas>
    </div>
  </div>

  <!-- Pizza + Tendências lado a lado -->
  <div class="cards">
    <div class="secao">
      <h2>🥧 Distribuição de Gastos</h2>
      <div class="pizza-flex">
        <canvas id="graficoPizza" class="canvas-pizza"></canvas>
        <div id="legendaPizza" class="legenda-pizza"></div>
      </div>
    </div>
    <div class="secao">
      <h2>📈 Tendências por Categoria</h2>
      <div id="painelTendencias"></div>
    </div>
  </div>

  <!-- Comparativo de meses -->
  <div class="bloco-analises com-margem">
    <div class="secao">
      <div class="comparativo-topo">
        <h2 class="sem-margem">📅 Comparativo Mensal</h2>
        <div class="comparativo-botoes">
          <button id="compBtn6" class="comp-periodo-btn ativo">6 meses</button>
          <button id="compBtn12" class="comp-periodo-btn">12 meses</button>
        </div>
      </div>
      <div id="tabelaComparativo"></div>
    </div>
  </div>

  <!-- Projeção financeira -->
  <div class="bloco-analises">
    <div class="secao">
      <h2>🔭 Projeção Financeira <span class="premium-tag">PREMIUM</span></h2>
      <p class="projecao-intro">Simule quanto seu patrimônio pode crescer com base nos seus hábitos atuais.</p>
      <div class="projecao-campos">
        <div class="projecao-campo">
          <label>Economia mensal (R$)</label>
          <input id="projEconomia" type="number" placeholder="Deixe em branco para usar saldo atual" min="0" step="0.01">
        </div>
        <div class="projecao-campo">
          <label>Projetar por (meses)</label>
          <input id="projMeses" type="number" value="12" min="1" max="360">
        </div>
        <div class="projecao-campo">
          <label>Meta (R$) — opcional</label>
          <input id="projMeta" type="number" placeholder="Ex: 10000" min="0" step="0.01">
        </div>
      </div>
      <button id="btnCalcularProjecao" class="btn-calcular-projecao">Calcular Projeção</button>
      <div id="projResultado" class="projecao-resultado"></div>
    </div>
  </div>

</div>
<script src="js/app.js"></script>
<script src="js/analises.js"></script>
</body>
</html>
