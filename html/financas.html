<!DOCTYPE html>
<html>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width,initial-scale=1'>
    <link rel='stylesheet' href='../css/style.css'>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href='dashboard.html'>Dashboard</a></li>
            </ul>
        </nav>
    </header>
    <div class='container'>
        <div class='cards'>
            <div class='card'>
                <h2>Receitas</h2>
                <input id='receitaNome' placeholder='Descrição'>
                <input id='receitaValor' type='number' placeholder='Valor'>
                <button onclick='adicionarReceita()'>Adicionar Receita</button>
                <ul id='listaReceitas'></ul>
            </div>
            <div class='card'>
                <h2>Despesas</h2>
                <input id='despesaNome' placeholder='Descrição'>
                <input id='despesaValor' type='number' placeholder='Valor'>
                <button onclick='adicionarDespesa()'>Adicionar Despesa</button>
                <ul id='listaDespesas'></ul>
            </div>
        </div>
        <div class='card'>
            <h2>Saldo Familiar</h2>
            <p id='saldo'></p>
        </div>
    </div>
</body>
    <script type='module' src='../script.js'></script>
</html>
