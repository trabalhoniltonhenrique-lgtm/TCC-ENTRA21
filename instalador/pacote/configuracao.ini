# CasaCapital - configuracao do servico
# Edite ANTES de rodar o Instalar.bat. Linhas iniciadas com # sao ignoradas.
# Para mudar depois de instalado: edite este arquivo e rode o Instalar.bat de novo.

# Porta em que o sistema fica disponivel (http://localhost:PORTA)
PORTA=8080

# Nome do servico do MySQL no Windows (padrao do instalador do MySQL 8.0)
SERVICO_MYSQL=MySQL80

# Usuario/senha que o sistema usa no MySQL. Se o banco ainda nao existir,
# o instalador cria o banco e este usuario (pede a senha do root do MySQL).
DB_USERNAME=casacapital_app
DB_PASSWORD=CasaCapital_2026!

# Conta Gmail usada no "Esqueci minha senha" + senha de app
# (gerada em myaccount.google.com/apppasswords). Pode ficar em branco:
# o sistema funciona, so o envio de e-mail falha.
MAIL_USERNAME=
MAIL_PASSWORD=
